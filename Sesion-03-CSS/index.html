<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería de Productos — Tarea CSS</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Calistoga&family=Ruslan+Display&display=swap" rel="stylesheet">
        <
    </head>
<body>

    <main class="container">
        <h1>TIENDA DE SKINCARE</h1>

        <!-- TODO: Galería de productos
             Cada tarjeta debe contener:
             - Imagen del producto (usa placeholder o imágenes de ejemplo)
             - Nombre del producto
             - Precio
             - Botón con texto "Comprar"
             
             Desktop (>=1024px): 3 columnas
             Mobile (<768px): 1 columna con scroll vertical
        -->
        <section class="galeria">

            <article class="producto">
                <img src="imagenes/jabon.png" alt="jabon facial">
                <div class="producto-info">
                    <h2>Jabón facial espumoso, centella</h2>
                    <p class="precio">Q195.00</p>
                    <button class="btn-comprar">Comprar</button>
                </div>
            </article>

            <article class="producto">
                <img src="imagenes/Niacinamida.jpg" alt="Niacinamida">
                <div class="producto-info">
                    <h2>Niacinamida, the ordinary</h2>
                    <p class="precio">Q125.99</p>
                    <button class="btn-comprar">Comprar</button>
                </div>
            </article>

            <article class="producto">
                <img src="imagenes/Glicolico.jpg" alt="Acido Glicolico">
                <div class="producto-info">
                    <h2>Ácido Glicólico, The ordinary</h2>
                    <p class="precio">Q199.99</p>
                    <button class="btn-comprar">Comprar</button>
                </div>
            </article>

            <article class="producto">
                <img src="imagenes/LabialDior.jpg" alt="Gloss">
                <div class="producto-info">
                    <h2>Gloss, Dior</h2>
                    <p class="precio">Q449.99</p>
                    <button class="btn-comprar">Comprar</button>
                </div>
            </article>

            <article class="producto">
                <img src="imagenes/ProtectorSolar.jpg" alt="Protector Solar">
                <div class="producto-info">
                    <h2>Protector solar, liquido, La Roche Posay</h2>
                    <p class="precio">Q399.99</p>
                    <button class="btn-comprar">Comprar</button>
                </div>
            </article>

            <article class="producto">
                <img src="imagenes/Barra.jpg" alt="Protector en barra">
                <div class="producto-info">
                    <h2>Protector solar en barra, Tocobo</h2>
                    <p class="precio">Q270.00</p>
                    <button class="btn-comprar">Comprar</button>
                </div>
            </article>

        </section>

        <h2>Lista de tareas pendientes</h2>

        <!-- TODO: Layout de Todo List
             Lista de tareas estilizada con:
             - Checkbox para marcar completado
             - Texto de la tarea
             - Diseño limpio y accesible
        -->
        <section class="todo-list">
            <ul class="tareas" role="list">
                <li class="tarea">
                    <input type="checkbox" id="t1">
                    <label for="t1">Aprender CSS Grid</label>
                </li>
                <li class="tarea">
                    <input type="checkbox" id="t2">
                    <label for="t2">Practicar Flexbox</label>
                </li>
                <li class="tarea">
                    <input type="checkbox" id="t3">
                    <label for="t3">Estudiar diseño responsivo</label>
                </li>
                <li class="tarea">
                    <input type="checkbox" id="t4">
                    <label for="t4">Hacer la tarea de CSS</label>
                </li>
                <li class="tarea">
                    <input type="checkbox" id="t5">
                    <label for="t5">Revisar novedades de CSS 2024</label>
                </li>
            </ul>
        </section>
    </main>

</body>
</html>
